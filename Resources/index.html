<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rothko</title>
  <style>
    :root { color-scheme: dark; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #21132d;
      background-image:
        radial-gradient(circle at 25% 30%, rgba(234, 106, 70, .95), transparent 42%),
        radial-gradient(circle at 75% 65%, rgba(54, 102, 145, .92), transparent 46%),
        linear-gradient(120deg, #2b183e, #7a3c45 48%, #152d45);
      background-size: 150% 150%;
      animation: drift 18s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { background-position: 0% 20%; }
      to { background-position: 100% 80%; }
    }
  </style>
</head>
<body aria-label="Animated gradient"></body>
</html>
