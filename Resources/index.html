<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rothko Screen Saver Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0047ff;
    }

    .test {
      position: absolute;
      top: 50%;
      left: 0;
      color: #fff;
      font: 900 clamp(72px, 18vw, 260px)/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.08em;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transform: translate(100vw, -50%);
      animation: scroll-test 4s linear infinite;
      white-space: nowrap;
    }

    @keyframes scroll-test {
      from { transform: translate(100vw, -50%); }
      to { transform: translate(-100%, -50%); }
    }
  </style>
</head>
<body>
  <div class="test">TEST</div>
</body>
</html>
