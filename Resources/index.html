<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rothko Screen Saver Test</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0047ff;
    }

    .test {
      position: absolute;
      top: 50%;
      left: 50%;
      color: #fff;
      font: 900 clamp(72px, 18vw, 260px)/1 -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.08em;
      text-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="test" id="test">TEST</div>
  <script>
    const test = document.getElementById('test');

    window.renderFrame = function renderFrame(time) {
      const phase = time * 1.5;
      test.style.left = `${50 + Math.sin(phase) * 35}%`;
      test.style.color = Math.sin(phase * 2) > 0 ? '#ffffff' : '#ffea00';
    };
  </script>
</body>
</html>
